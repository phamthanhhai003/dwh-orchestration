# Template secret SA_PASSWORD cho MSSQL fixture dev (xem kafka/mssql-dev.yaml).
# KHONG commit file co password that. Copy thanh secret that roi dien:
#
#   cp kafka/mssql-dev-secret.example.yaml kafka/mssql-dev-secret.yaml
#   # sua SA_PASSWORD trong stringData
#   kubectl apply -f kafka/mssql-dev-secret.yaml      # apply TRUOC khi apply mssql-dev.yaml
apiVersion: v1
kind: Secret
metadata:
  name: mssql-sa-secret
  namespace: bnctl-kafka-development-ns
type: Opaque
stringData:
  SA_PASSWORD: CHANGE_ME

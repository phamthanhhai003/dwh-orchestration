# Kafka cluster (KRaft mode) - DEV mo phong topology PROD (tach pool)
# Topology: 3 controller dedicated + 1 broker
#   - Controller CHOT 3 ngay: Strimzi dung STATIC controller quorum -> so controller
#     KHONG scale duoc sau (phai rebuild). Nen dung dung so prod tu dau.
#   - Broker de 1 o DEV: broker scale DE (them pod + reassign) -> len prod tang sau.
#   - DEV 1 broker => RF=1 (data SPOF, chap nhan vi DEV khong can data HA).
#     Len prod: them broker + nang default.replication.factor=3, min.insync.replicas=2.
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: controller
  namespace: kafka-development-ns
  labels:
    strimzi.io/cluster: cdc
spec:
  replicas: 3
  roles:
    - controller
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 2Gi              # controller chi chua metadata log -> nho
        class: longhorn
        deleteClaim: false
  resources:                   # controller nhe: khong dung data traffic
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
  jvmOptions:
    "-Xms": 512m
    "-Xmx": 512m
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: broker
  namespace: kafka-development-ns
  labels:
    strimzi.io/cluster: cdc
spec:
  replicas: 1                  # DEV: 1 broker; len prod tang >=3
  roles:
    - broker
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 5Gi              # broker chua data thuc
        class: longhorn
        deleteClaim: false
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 2Gi
---
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: cdc
  namespace: kafka-development-ns
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: 3.9.0
    metadataVersion: 3.9-IV0
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: tls
        port: 9093
        type: internal
        tls: true
    config:
      # DEV 1 broker => moi replication factor = 1 (nang len khi them broker o prod)
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
      log.retention.hours: 168
  entityOperator:
    topicOperator: {}
    userOperator: {}

# Template secret credentials MSSQL cho Debezium.
# KHONG commit file co password that. Copy thanh secret.yaml (da .gitignore) roi dien:
#
#   cp kafka/secret.example.yaml kafka/secret.yaml
#   # sua username/password trong stringData
#   kubectl apply -f kafka/secret.yaml
#
# FileConfigProvider doc theo dinh dang .properties => dung 1 key "mssql.properties".
apiVersion: v1
kind: Secret
metadata:
  name: mssql-credentials
  namespace: kafka-development-ns
type: Opaque
stringData:
  mssql.properties: |
    username=dp_cdc
    password=CHANGE_ME

# Template secret credentials MSSQL cho Debezium - UAT.
# KHONG commit file co password that. Tao secret.yaml ngay tren jumpserver, apply xong XOA file.
# (Dinh huong prod la HashiCorp Vault — UAT tam dung K8s Secret.)
#
# FileConfigProvider doc theo dinh dang .properties => dung 1 key "mssql.properties".
apiVersion: v1
kind: Secret
metadata:
  name: mssql-credentials
  namespace: kafka-uat-ns
type: Opaque
stringData:
  mssql.properties: |
    username=CHANGE_ME
    password=CHANGE_ME

# Template secret credentials cho cac SparkApplication (namespace bnctl-spark2-development-ns).
# KHONG commit file co credential that. Copy thanh secret.yaml (da .gitignore) roi dien:
#
#   cp spark/manifests/secret.example.yaml spark/manifests/secret.yaml
#   # sua cac gia tri trong stringData
#   kubectl apply -f spark/manifests/secret.yaml
#
# - minio-credentials : MinIO access/secret key (s3a + Iceberg S3FileIO doc qua env AWS_*).
# - mssql-credentials : password MSSQL cho job pull EXTRACT (t24_jdbc_extract.py doc MSSQL_PASSWORD).
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-credentials
  namespace: bnctl-spark2-development-ns
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: CHANGE_ME
  AWS_SECRET_ACCESS_KEY: CHANGE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: mssql-credentials
  namespace: bnctl-spark2-development-ns
type: Opaque
stringData:
  MSSQL_PASSWORD: CHANGE_ME

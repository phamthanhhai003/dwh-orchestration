# ============================================================================
# INTERFACE CHO DEV: danh sach bang CDC streaming dua vao Bronze.
# >>> QUY TRINH THEM BANG day du: xem spark/manifests/guide_for_dev.md <<<
#
# Moi dong tables.txt:  NAME=<kafka_topic>:<bronze_table>
#   NAME=t24.<db>.<schema>.<TABLE>:hive.bronze.t24_<ten>   ('#'=comment, dong trong bo qua)
# Sau khi sua:
#   kubectl apply -f spark/manifests/cdc-tables.yaml
#   kubectl -n bnctl-spark2-development-ns delete sparkapplication t24-cob-streaming
#   kubectl apply -f spark/manifests/t24-cob-streaming.yaml
# Nho: con phai them bang vao table.include.list o kafka/03-mssql-connector.yaml (xem guide).
# ============================================================================

apiVersion: "sparkoperator.k8s.io/v1beta2"
kind: SparkApplication
metadata:
  name: "crb-sync-{{ macros.uuid.uuid4().hex[:10] }}"
  namespace: "{{ var.value.get('SPARK_NAMESPACE', 'bnctl-spark2-development-ns') }}"

spec:
  type: Python
  mode: cluster
  image: "haiptjits/spark-3.5.1:v2"
  imagePullPolicy: IfNotPresent
  pythonVersion: "3"
  mainApplicationFile: "s3a://spark-scripts/crb_sync_spark.py"
  sparkVersion: "3.5.1"

  sparkConf:
    "spark.driver.extraClassPath": "/opt/spark/jars/*"
    "spark.executor.extraClassPath": "/opt/spark/jars/*"
    # MinIO s3a chỉ để Spark đọc mainApplicationFile (job tự dùng boto3 cho upload)
    "spark.hadoop.fs.s3a.endpoint": "{{ conn.minio_conn.extra_dejson.endpoint_url }}"
    "spark.hadoop.fs.s3a.access.key": "{{ conn.minio_conn.login }}"
    "spark.hadoop.fs.s3a.secret.key": "{{ conn.minio_conn.password }}"
    "spark.hadoop.fs.s3a.path.style.access": "true"
    "spark.hadoop.fs.s3a.impl": "org.apache.hadoop.fs.s3a.S3AFileSystem"

  driver:
    cores: 1
    coreLimit: "1200m"
    memory: "512m"
    serviceAccount: spark-sa
    env: &sync_env
      - name: SFTP_HOST
        value: "{{ var.value.SFTP_HOST }}"
      - name: SFTP_PORT
        value: "{{ var.value.get('SFTP_PORT', '22') }}"
      - name: SFTP_USER
        value: "{{ var.value.SFTP_USER }}"
      - name: SFTP_PASS
        value: "{{ var.value.SFTP_PASS }}"
      - name: REMOTE_DIR
        value: "{{ var.value.SFTP_REMOTE_DIR_CRB }}"
      - name: BUCKET_NAME
        value: "{{ var.value.BUCKET_NAME }}"
      - name: MINIO_ENDPOINT
        value: "{{ conn.minio_conn.extra_dejson.endpoint_url }}"
      - name: MINIO_ACCESS_KEY
        value: "{{ conn.minio_conn.login }}"
      - name: MINIO_SECRET_KEY
        value: "{{ conn.minio_conn.password }}"
      - name: MINIO_PREFIX
        value: "crb"
      - name: START_DATE
        value: "{{ ti.xcom_pull(task_ids='detect_sftp', key='business_date') }}"
      - name: END_DATE
        value: "{{ ti.xcom_pull(task_ids='detect_sftp', key='business_date') }}"
      - name: SPARK_EXECUTOR_INSTANCES
        value: "1"
    affinity: &worker02
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values: ["k8s-bnctl-dw-dev-worker-02"]

  executor:
    cores: 1
    coreLimit: "1200m"
    instances: 1
    memory: "512m"
    env: *sync_env
    affinity: *worker02

  restartPolicy:
    type: Never

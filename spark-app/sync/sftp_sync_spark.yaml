apiVersion: "sparkoperator.k8s.io/v1beta2"
kind: SparkApplication
metadata:
  name: "sftp-hold-sync-{{ params.slug }}-job"
  namespace: "{{ var.value.get('SPARK_NAMESPACE', 'bnctl-spark2-development-ns') }}"
spec:
  type: Python
  mode: cluster
  image: "congtvjits/spark-t24:build-182"
  imagePullPolicy: IfNotPresent
  pythonVersion: "3"
  mainApplicationFile: "local:///opt/jobs/sftp_sync_spark.py"
  sparkVersion: "3.5.1"
  sparkConf:
    "spark.driver.extraClassPath": "/opt/spark/jars/*"
    "spark.executor.extraClassPath": "/opt/spark/jars/*"
    # MinIO s3a chỉ để đọc mainApplicationFile (script không dùng Iceberg)
    "spark.hadoop.fs.s3a.endpoint": "{{ conn.minio_conn.extra_dejson.endpoint_url }}"
    "spark.hadoop.fs.s3a.access.key": "{{ conn.minio_conn.login }}"
    "spark.hadoop.fs.s3a.secret.key": "{{ conn.minio_conn.password }}"
    "spark.hadoop.fs.s3a.path.style.access": "true"
    "spark.hadoop.fs.s3a.impl": "org.apache.hadoop.fs.s3a.S3AFileSystem"
  driver:
    cores: {{ var.value.get('SPARK_SFTP_SYNC_DRIVER_CORES', '1') | int }}
    coreLimit: "{{ var.value.get('SPARK_SFTP_SYNC_DRIVER_CORE_LIMIT', '1200m') }}"
    memory: "{{ var.value.get('SPARK_SFTP_SYNC_DRIVER_MEMORY', '2g') }}"
    serviceAccount: spark-sa
    env: &sftp_env
      - name: SFTP_HOST
        value: "{{ var.value.SFTP_HOST }}"
      - name: SFTP_PORT
        value: "{{ var.value.get('SFTP_PORT', '22') }}"
      - name: SFTP_USER
        value: "{{ var.value.SFTP_USER }}"
      - name: SFTP_PASS
        value: "{{ var.value.SFTP_PASS }}"
      # Thư mục HOLD phẳng (mock dev / Windows server thật)
      - name: REMOTE_DIR
        value: "{{ var.value.SFTP_REMOTE_DIR_HOLD }}"
      # Raw bucket đích
      - name: BUCKET_NAME
        value: "{{ var.value.get('RAW_BUCKET', 'raw') }}"
      - name: MINIO_ENDPOINT
        value: "{{ conn.minio_conn.extra_dejson.endpoint_url }}"
      - name: MINIO_ACCESS_KEY
        value: "{{ conn.minio_conn.login }}"
      - name: MINIO_SECRET_KEY
        value: "{{ conn.minio_conn.password }}"
      # Per-report (fan-out): report + D + manifest do task DAG sinh ra
      - name: REPORT_NAME
        value: "{{ params.report_name }}"
      - name: BUSINESS_DATE
        value: "{{ ti.xcom_pull(task_ids='detect', key='business_date') }}"
      - name: MANIFEST_BUCKET
        value: "{{ var.value.get('SFTP_MANIFEST_BUCKET', 'spark-scripts') }}"
      - name: MANIFEST_KEY
        value: "{{ ti.xcom_pull(task_ids=params.manifest_task_id, key='manifest_key') }}"
      - name: SPARK_EXECUTOR_INSTANCES
        value: "{{ var.value.get('SPARK_SFTP_SYNC_EXECUTOR_INSTANCES', '2') }}"
  executor:
    cores: {{ var.value.get('SPARK_SFTP_SYNC_EXECUTOR_CORES', '1') | int }}
    coreLimit: "{{ var.value.get('SPARK_SFTP_SYNC_EXECUTOR_CORE_LIMIT', '1200m') }}"
    instances: {{ var.value.get('SPARK_SFTP_SYNC_EXECUTOR_INSTANCES', '2') | int }}
    memory: "{{ var.value.get('SPARK_SFTP_SYNC_EXECUTOR_MEMORY', '2g') }}"
    env: *sftp_env
  restartPolicy:
    type: Never

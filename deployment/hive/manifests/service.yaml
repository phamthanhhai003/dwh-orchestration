apiVersion: v1
kind: Service
metadata:
  name: hive-metastore
  namespace: bnctl-hive-development-ns
spec:
  clusterIP: 10.43.83.186
  clusterIPs:
  - 10.43.83.186
  externalTrafficPolicy: Cluster
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - name: thrift
    nodePort: 30083
    port: 9083
    protocol: TCP
    targetPort: 9083
  selector:
    app: hive-metastore
  sessionAffinity: None
  type: NodePort

# chart: kibana 7.17.3
# repo: https://github.com/elastic/helm-charts
---
elasticsearchHosts: http://elasticsearch-master:9200
ingress:
  className: nginx
  enabled: true
  hosts:
  - host: kibana-dwh.bnctl.develop
    paths:
    - path: /
resources:
  limits:
    cpu: 500m
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 512Mi


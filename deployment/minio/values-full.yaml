# chart: minio 5.1.0
# repo: https://min.io
---
consoleIngress:
  enabled: true
  hosts:
  - minio-dwh.bnctl.develop
  ingressClassName: nginx
consoleService:
  nodePort: 31001
  type: NodePort
drivesPerNode: 1
# Buckets DWH cần sẵn — chart tạo qua post-install job (không có trên cụm gốc,
# trước đây tạo tay; thêm vào đây để fresh install tự tạo)
buckets:
- name: raw
  policy: none
  purge: false
- name: hive-warehouse
  policy: none
  purge: false
- name: checkpoint
  policy: none
  purge: false
- name: spark-scripts
  policy: none
  purge: false
- name: dremio
  policy: none
  purge: false
- name: airflow-logs
  policy: none
  purge: false
ingress:
  enabled: true
  hosts:
  - minio-dwh-api.bnctl.develop
  ingressClassName: nginx
mode: distributed
persistence:
  enabled: true
  size: 20Gi
  storageClassName: longhorn
replicas: 2
resources:
  limits:
    cpu: 1024m
    memory: 2Gi
  requests:
    cpu: 512m
    memory: 1Gi
rootPassword: minio-secret-key-change-me
rootUser: minioadmin
service:
  nodePort: 31002
  type: NodePort


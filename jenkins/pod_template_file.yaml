---
apiVersion: v1
kind: Pod
metadata:
  name: placeholder-name
  labels:
    tier: airflow
    component: worker
    release: airflow
  annotations:
    cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
spec:
  initContainers: []
  containers:
  - envFrom: []
    env:
    - name: AIRFLOW__CORE__EXECUTOR
      value: "KubernetesExecutor"
    - name: AIRFLOW__CORE__FERNET_KEY
      valueFrom:
        secretKeyRef:
          name: airflow-fernet-key
          key: fernet-key
    - name: AIRFLOW_HOME
      value: /opt/airflow
    - name: AIRFLOW__CORE__SQL_ALCHEMY_CONN
      valueFrom:
        secretKeyRef:
          name: airflow-metadata
          key: connection
    - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
      valueFrom:
        secretKeyRef:
          name: airflow-metadata
          key: connection
    - name: AIRFLOW_CONN_AIRFLOW_DB
      valueFrom:
        secretKeyRef:
          name: airflow-metadata
          key: connection
    - name: AIRFLOW__API__SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: airflow-api-secret-key
          key: api-secret-key
    - name: AIRFLOW__API_AUTH__JWT_SECRET
      valueFrom:
        secretKeyRef:
          name: airflow-jwt-secret
          key: jwt-secret
    - name: AIRFLOW__LOGGING__REMOTE_LOGGING
      value: "True"
    - name: AIRFLOW__KUBERNETES_ENVIRONMENT_VARIABLES__AIRFLOW__LOGGING__REMOTE_LOGGING
      value: "True"
    - name: AIRFLOW__LOGGING__REMOTE_BASE_LOG_FOLDER
      value: "s3://airflow-logs"
    - name: AIRFLOW__KUBERNETES_ENVIRONMENT_VARIABLES__AIRFLOW__LOGGING__REMOTE_BASE_LOG_FOLDER
      value: "s3://airflow-logs"
    - name: AIRFLOW__LOGGING__REMOTE_LOG_CONN_ID
      value: "minio"
    - name: AIRFLOW__KUBERNETES_ENVIRONMENT_VARIABLES__AIRFLOW__LOGGING__REMOTE_LOG_CONN_ID
      value: "minio"
    - name: AIRFLOW_CONN_MINIO
      valueFrom:
        secretKeyRef:
          name: airflow-minio-conn
          key: connection
    - name: AIRFLOW__KUBERNETES_ENVIRONMENT_VARIABLES__AIRFLOW_CONN_MINIO
      valueFrom:
        secretKeyRef:
          name: airflow-minio-conn
          key: connection
    image: IMAGE_PLACEHOLDER
    imagePullPolicy: IfNotPresent
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
    name: base
    resources:
      limits:
        cpu: 1000m
        memory: 2Gi
      requests:
        cpu: 500m
        memory: 1Gi
    volumeMounts:
    - mountPath: "/opt/airflow/logs"
      name: logs
    - name: config
      mountPath: "/opt/airflow/airflow.cfg"
      subPath: airflow.cfg
      readOnly: true
    - name: config
      mountPath: "/opt/airflow/config/airflow_local_settings.py"
      subPath: airflow_local_settings.py
      readOnly: true
    - name: pull-bulk-dag-patch
      mountPath: /opt/airflow/dags/repo/dags/pull_bulk_dag.py
      subPath: pull_bulk_dag.py
      readOnly: true
    - name: pull-bulk-fresh-dag-patch
      mountPath: /opt/airflow/dags/repo/dags/pull_bulk_fresh_dag.py
      subPath: pull_bulk_fresh_dag.py
      readOnly: true
    - name: pull-bulk-fresh-parse-yaml
      mountPath: /opt/airflow/dags/repo/spark-app/parser/t24_bulk_fresh_parse.yaml
      subPath: t24_bulk_fresh_parse.yaml
      readOnly: true
  restartPolicy: Never
  securityContext:
    runAsUser: 50000
    fsGroup: 0
  nodeSelector: {}
  affinity: {}
  terminationGracePeriodSeconds: 600
  tolerations: []
  topologySpreadConstraints: []
  serviceAccountName: "airflow-worker"
  volumes:
  - emptyDir: {}
    name: logs
  - configMap:
      name: airflow-config
    name: config
  - name: pull-bulk-dag-patch
    configMap:
      name: pull-bulk-dag-patch
  - name: pull-bulk-fresh-dag-patch
    configMap:
      name: pull-bulk-fresh-dag-patch
  - name: pull-bulk-fresh-parse-yaml
    configMap:
      name: pull-bulk-fresh-parse-yaml
